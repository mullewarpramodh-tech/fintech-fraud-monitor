server:
  port: 8082

spring:
  application:
    name: fraud-service
  
  # Database Configuration: Credentials must be supplied via environment variables (SEC-03)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Connect to Kafka Broker
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "java.util.Map"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

fraud:
  kafka:
    dlt-topic: ${FRAUD_KAFKA_DLT_TOPIC:transaction-events-dlt}
    retry-interval-ms: ${FRAUD_KAFKA_RETRY_INTERVAL_MS:1000}
    max-retry-attempts: ${FRAUD_KAFKA_MAX_RETRY_ATTEMPTS:2}
  rules:
    max-single-transaction-amount: 10000.00
    max-velocity-count: 3
    velocity-window-seconds: 60
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    # Experimental threshold tuned on synthetic validation data (not for autonomous banking settlement)
    threshold: ${ML_FRAUD_THRESHOLD:0.14}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:2000}
    fallback-status: ${ML_FALLBACK_STATUS:MANUAL_REVIEW}
