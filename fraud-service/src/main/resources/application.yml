server:
  port: 8082

spring:
  application:
    name: fraud-service
  
  # Connect to Neon Serverless PostgreSQL with environment variable support
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-shape-ayu0rbwk.c-5.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_kbZEde71mMUI}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Connect to Kafka Broker
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "java.util.Map"

fraud:
  rules:
    max-single-transaction-amount: 10000.00
    max-velocity-count: 3
    velocity-window-seconds: 60
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    # Experimental threshold tuned on synthetic validation data (not for autonomous banking settlement)
    threshold: ${ML_FRAUD_THRESHOLD:0.14}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:2000}
    fallback-status: ${ML_FALLBACK_STATUS:MANUAL_REVIEW}
