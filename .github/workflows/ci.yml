name: FinTech Fraud Monitor CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-java-services:
    name: Test Java Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test Transaction Service
        run: mvn -B clean test --file transaction-service/pom.xml

      - name: Test Fraud Detection Service
        run: mvn -B clean test --file fraud-service/pom.xml

  test-ml-service:
    name: Test Python ML Service
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ml-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt

      - name: Verify model artifacts
        run: |
          test -f ml-service/app/models/fraud_pipeline.joblib || { echo "Model artifact missing!"; exit 1; }
          test -f ml-service/app/models/model_metadata.json || { echo "Model metadata missing!"; exit 1; }

      - name: Run pytest
        working-directory: ml-service
        run: python -m pytest tests -v

  validate-docker:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config
        run: docker compose config
