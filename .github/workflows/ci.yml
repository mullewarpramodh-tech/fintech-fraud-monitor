name: FinTech Fraud Monitor CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test Transaction Service
        run: mvn -B clean test --file transaction-service/pom.xml

      - name: Test Fraud Detection Service
        run: mvn -B clean test --file fraud-service/pom.xml

      - name: Verify Docker Compose Config
        run: docker compose config
